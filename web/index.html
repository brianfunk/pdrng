<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pdrng · Your seed, your number, your fate</title>
    <meta name="description" content="Type a word, get a number. From that one number pdrng derives your card, roulette spin, tarot draw, 8-ball answer, zodiac sign and more. Same seed, same fate, every time." />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="pdrng · Your seed, your number, your fate" />
    <meta property="og:description" content="Deterministic coin flips, dice, cards, roulette, tarot and fortunes from a single seed." />
    <meta property="og:url" content="https://pdrng.netlify.app/" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <script>
      try {
        const param = new URLSearchParams(location.search).get('theme');
        const stored = param || localStorage.getItem('pdrng-theme');
        const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
